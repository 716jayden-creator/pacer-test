<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순장유형테스트 — 20기 순장사관학교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  :root{
    --purple:#382672; --purple-2:#5B47A8; --lav:#ECE6F5; --cream:#F6F2EF;
    --card:#FFFDFB; --ink:#2A2045; --muted:#4E4668; --green:#A7D081;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Noto Sans KR',Arial,sans-serif;background:var(--purple);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}

  /* start */
  #start{color:var(--cream);padding:56px 28px 40px;justify-content:space-between;
    background:
      linear-gradient(172deg, rgba(255,255,255,.05) 0 18%, transparent 18% 26%, rgba(255,255,255,.04) 26% 30%, transparent 30%),
      var(--purple)}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--green)}
  .hero{margin-top:28px}
  #start{text-align:center;padding:44px 22px 36px;gap:22px;justify-content:flex-start}
  .kicker{display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:700;color:var(--green);letter-spacing:.02em}
  .kicker span{display:block;width:36px;height:2px;background:var(--green)}
  .logo{font-size:clamp(34px,11vw,50px);font-weight:900;line-height:1.05;margin-top:12px;color:var(--cream);letter-spacing:-.01em}
  .logo em{font-style:inherit;color:var(--green)}
  .uline{width:34%;height:6px;border-radius:3px;background:var(--green);margin:10px auto 0}
  .pill{display:inline-block;margin-top:16px;padding:9px 20px;border-radius:999px;background:#4B3A8A;color:var(--cream);font-size:19px;font-weight:800}
  .st-art{position:relative}
  .chars{display:block;width:108%;margin-left:-4%;height:auto}
  .pill-green{background:var(--green);color:var(--purple);font-size:16px;margin-top:-8px;position:relative}
  #start p.lead{font-size:15px;line-height:1.7;color:#D4CCEB}
  #start{position:relative;overflow:hidden;background:linear-gradient(180deg,#9FD3F5 0%,#CFEAFB 42%,#EEF8F1 78%,#F6F2EF 100%) !important;color:#1F3D2A;text-align:center;padding:0 !important;gap:0 !important}
  .sky{position:absolute;inset:0;pointer-events:none}
  .cloud{position:absolute;background:#FFFFFF;border-radius:999px;opacity:.85;filter:blur(.3px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#FFFFFF;border-radius:50%}
  .c1{width:120px;height:34px;top:70px;left:-20px;animation:drift 18s linear infinite}
  .c1::before{width:56px;height:56px;left:22px;top:-26px}.c1::after{width:40px;height:40px;left:62px;top:-16px}
  .c2{width:90px;height:26px;top:130px;right:-10px;animation:drift 22s linear infinite reverse}
  .c2::before{width:42px;height:42px;left:16px;top:-20px}.c2::after{width:30px;height:30px;left:48px;top:-12px}
  .c3{width:70px;height:20px;top:24px;right:90px;opacity:.6;animation:drift 26s linear infinite}
  .c3::before{width:32px;height:32px;left:12px;top:-16px}.c3::after{width:24px;height:24px;left:36px;top:-10px}
  @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(24px)}100%{transform:translateX(0)}}
  .st-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:34px 22px 40px}
  .badge{display:inline-block;background:#1F3D2A;color:#E9F7D8;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;letter-spacing:.02em}
  .st-h1{font-size:34px;line-height:1.28;font-weight:900;margin-top:18px;color:#1F3D2A;letter-spacing:-.02em}
  .st-h1 mark{background:linear-gradient(transparent 58%,#B8E07F 58%);color:inherit;padding:0 4px}
  .st-sub{font-size:16px;font-weight:600;color:#3E5A46;margin-top:10px}
  .deck{position:relative;width:100%;height:215px;margin-top:24px}
  .mc{position:absolute;top:10px;left:50%;width:36%;max-width:160px;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:4px solid #FFFFFF;box-shadow:0 10px 24px rgba(31,61,42,.22);transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
  .mc img{width:100%;height:100%;object-fit:cover;filter:blur(7px) saturate(1.3) brightness(1.02);transform:scale(1.15)}
  .mc b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:#FFFFFF;text-shadow:0 3px 0 rgba(31,61,42,.35)}
  .m1{--r:-16deg;--x:-100%;animation-delay:0s;top:26px}
  .m2{--r:-6deg;--x:-66%;animation-delay:.4s;top:8px}
  .m3{--r:6deg;--x:-30%;animation-delay:.8s;top:8px}
  .m4{--r:16deg;--x:4%;animation-delay:1.2s;top:26px}
  .mc{transform:translateX(var(--x)) rotate(var(--r))}
  @keyframes bob{0%,100%{transform:translateX(var(--x)) rotate(var(--r)) translateY(0)}50%{transform:translateX(var(--x)) rotate(var(--r)) translateY(-10px)}}
  .deck-cap{font-size:16px;font-weight:700;color:#1F3D2A;margin-top:4px}
  .deck-cap b{color:#2E7D32}
  .chips{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .chips span{background:rgba(255,255,255,.85);border:1.5px solid #CFE3D2;color:#2E5E3A;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px}
  .btn-start{margin-top:22px;background:#2E5E3A;color:#FFFFFF;font-size:19px;box-shadow:0 5px 0 #1A3A22;animation:pulse 2.2s ease-in-out infinite;position:relative}
  .btn-start:active{transform:translateY(3px);box-shadow:0 2px 0 #1A3A22}
  .btn-start .arr{display:inline-block;margin-left:6px;transition:transform .2s}
  .btn-start:hover .arr{transform:translateX(4px)}
  @keyframes pulse{0%,100%{box-shadow:0 5px 0 #1A3A22,0 0 0 0 rgba(155,211,106,.6)}50%{box-shadow:0 5px 0 #1A3A22,0 0 0 10px rgba(155,211,106,0)}}
  #start .meta{color:#5D7A64;margin-top:12px}
  .track{position:absolute;left:-10%;right:-10%;bottom:-60px;height:120px;background:#E6A08A;border-radius:50% 50% 0 0;opacity:.35;z-index:0}
  .track::before,.track::after{content:"";position:absolute;left:0;right:0;height:3px;background:#FFFFFF;opacity:.8;border-radius:50%}
  .track::before{top:28px}.track::after{top:56px}
  @media (prefers-reduced-motion: reduce){.mc,.cloud,.btn-start{animation:none}}
  #result.on .timg{animation:flipin .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes flipin{0%{transform:perspective(900px) rotateY(90deg) scale(.85);opacity:0}60%{transform:perspective(900px) rotateY(-8deg) scale(1.02);opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
  .hero{margin-top:24px}
  .hero svg{display:block;width:100%;height:auto}
  .timg{display:block;width:100%;height:auto;border-radius:22px;margin-top:16px;aspect-ratio:1/1;background:#ECE6F5}
  .tcard{margin-top:16px;border-radius:24px;padding:18px 22px 24px;color:#2A2045}
  .tchar svg{display:block;width:72%;max-width:300px;height:auto;margin:0 auto}
  .t-small{font-size:15px;font-weight:700;margin-top:4px;color:#4E4668}
  .t-mid{font-size:20px;font-weight:800;margin-top:2px;color:#2A2045}
  .t-big{font-size:34px;font-weight:900;line-height:1.2;margin-top:2px}
  .types-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
  .types-mini div{background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700}
  .types-mini span{display:block;font-size:12px;font-weight:500;color:#D4CCEB;margin-top:4px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
  .btn-green{background:var(--green);color:var(--purple)}
  .btn-ghost{background:transparent;color:var(--purple);border:2px solid var(--purple)}
  .meta{font-size:13px;color:#BFB5DE;text-align:center;margin-top:14px}

  /* question */
  #quiz{background:var(--cream);padding:28px 22px 32px}
  .top{display:flex;align-items:center;gap:14px}
  .back{border:0;background:transparent;font:inherit;font-size:15px;font-weight:700;color:var(--purple-2);cursor:pointer;padding:6px 0;visibility:hidden}
  .progress{flex:1;height:8px;background:#E2DBEE;border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--purple);border-radius:4px;transition:width .3s}
  .count{font-size:14px;font-weight:700;color:var(--muted);min-width:44px;text-align:right}
  .qbox{margin-top:36px}
  .qnum{font-size:14px;font-weight:800;color:var(--purple-2)}
  .qtext{font-size:24px;line-height:1.45;font-weight:800;color:var(--purple);margin-top:10px}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  .opt{text-align:left;border:2px solid transparent;background:var(--card);border-radius:16px;padding:18px 18px;font:inherit;font-size:16px;line-height:1.55;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(56,38,114,.08);transition:border-color .15s, background .15s}
  .opt:hover{border-color:#CFC4E8}
  .opt.picked{border-color:var(--purple);background:var(--lav)}

  /* result */
  #result{background:var(--cream)}
  .res-head{background:var(--purple);color:var(--cream);padding:44px 26px 34px;border-radius:0 0 28px 28px}
  .res-head .eyebrow{color:var(--green)}
  
  .res-tag{font-size:16px;color:#D4CCEB;margin-top:16px;line-height:1.6}
  .res-body{padding:24px 22px 36px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:20px;padding:22px}
  .card h3{font-size:15px;font-weight:800;color:var(--purple-2);margin-bottom:8px}
  .card p{font-size:16px;line-height:1.7;color:var(--ink)}
  .card.dark{background:var(--purple);color:var(--cream)}
  .card.dark h3{color:var(--green)}
  .card.dark p{color:var(--cream)}
  .scores{display:flex;flex-direction:column;gap:12px}
  .srow{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:15px;font-weight:700}
  .srow .track{height:12px;background:#E2DBEE;border-radius:6px;overflow:hidden}
  .srow .fill{height:100%;background:var(--purple-2);border-radius:6px;transition:width .6s}
  .srow.top .fill{background:var(--purple)}
  .srow .n{text-align:right;color:var(--muted);font-weight:500}
  .srow.top span:first-child{color:var(--purple)}
  .tip{font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
  .question-q{font-size:18px;font-weight:800;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <section id="start" class="screen on">
    <div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
    <div class="st-wrap">
      <p class="badge">20th 순장사관학교 · THE PACER RUN</p>
      <h1 class="st-h1">순모임에서 나는<br><mark>어떤 순장</mark>일까?</h1>
      <p class="st-sub">12가지 순모임 상황, 당신의 선택은?</p>

      <div class="deck" aria-hidden="true">
        <div class="mc m1"><img src="img/C-v2.jpg" alt=""><b>?</b></div>
        <div class="mc m2"><img src="img/R-v2.jpg" alt=""><b>?</b></div>
        <div class="mc m3"><img src="img/H-v2.jpg" alt=""><b>?</b></div>
        <div class="mc m4"><img src="img/N-v2.jpg" alt=""><b>?</b></div>
      </div>
      <p class="deck-cap">4장의 카드 중 <b>나의 카드</b>는?</p>

      <div class="chips"><span>12문항</span><span>약 3분</span><span>정답 없음</span></div>

      <button class="btn btn-start" id="go">내 순장 카드 뽑기 <span class="arr">→</span></button>
      <p class="meta">결과는 강의 후 나눔 시간에 함께 사용해요</p>
    </div>
    <div class="track"></div>
  </section>

  <section id="quiz" class="screen">
    <div class="top">
      <button class="back" id="back">← 이전</button>
      <div class="progress"><i id="prog"></i></div>
      <span class="count" id="count">1/12</span>
    </div>
    <div class="qbox">
      <p class="qnum" id="qnum">Q1</p>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="res-head">
      <p class="eyebrow">나의 순장 유형은</p>
      <img class="timg" id="timg" alt="">
      <p class="res-tag" id="rTag"></p>
    </div>
    <div class="res-body">
      <div class="card">
        <h3>나의 강점</h3>
        <p id="rStrength"></p>
      </div>
      <div class="card">
        <h3>나에게 필요한 능력</h3>
        <p id="rCaution"></p>
      </div>
      <div class="card">
        <h3>유형별 점수</h3>
        <div class="scores" id="rScores"></div>
      </div>
      <p class="tip">결과 화면을 캡처해 두세요. 강의 후 나눔 시간에 사용합니다.</p>
      <button class="btn btn-ghost" id="again">다시 하기</button>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script>
const TYPES = {
  C:{name:'코치형', tag:'목표를 제시하고 성장을 이끄는 순장',
     strength:'순원이 제자리에 머물지 않도록 다음 걸음을 보여 줍니다. 막연한 다짐을 구체적인 실천으로 바꾸도록 돕고, 순원이 자라는 모습을 보며 힘을 얻습니다.',
     caution:'기다려 주는 공감이에요. 순원의 속도에 맞춰 멈춰 서고, 해결책을 말하기 전에 끝까지 들어 주는 러닝메이트의 능력이 더해지면 순원이 지치지 않고 함께 달릴 수 있어요.',
     challenge:'러닝메이트처럼 달려 보세요. 이번 텀에는 해결책을 말하기 전에 순원의 이야기를 끝까지 들어 주세요.'},
  R:{name:'러닝메이트형', tag:'순원의 이야기를 듣고 곁을 지키는 순장',
     strength:'순원이 마음 깊은 이야기를 꺼낼 수 있는 안전한 사람입니다. 판단하지 않고 곁에 머물며, 순원이 혼자가 아니라는 것을 느끼게 해 줍니다.',
     caution:'한 걸음 이끄는 힘이에요. 공감 위에 작은 다음 걸음을 함께 정해 주는 코치의 능력이 더해지면 순원이 머물지 않고 자라갈 수 있어요. 나도 지치지 않도록 건강한 경계를 세우는 지혜도 필요해요.',
     challenge:'코치처럼 달려 보세요. 이번 텀에는 순원과 함께 실천할 작은 다음 걸음 하나를 정해 보세요.'},
  H:{name:'치어리더형', tag:'격려하고 응원하며 힘을 주는 순장',
     strength:'순 분위기를 밝게 만들고, 순원이 스스로를 귀하게 여기도록 힘을 줍니다. 낙심한 순원도 다시 일어설 용기를 얻습니다.',
     caution:'말씀으로 세우는 힘이에요. 격려에 말씀 한 구절을 더하고, 필요할 때는 사랑으로 권면하는 내비게이터의 능력이 더해지면 응원이 더 오래 힘이 돼요.',
     challenge:'내비게이터처럼 달려 보세요. 이번 텀에는 격려의 말과 함께 말씀 한 구절을 나눠 보세요.'},
  N:{name:'내비게이터형', tag:'말씀을 통해 방향을 제시하는 순장',
     strength:'흔들리는 순원에게 말씀으로 분명한 기준과 방향을 보여 줍니다. 순모임이 말씀 중심으로 깊어지도록 이끕니다.',
     caution:'마음을 먼저 알아주는 따뜻함이에요. 가르치기 전에 칭찬과 격려 한마디를 건네는 치어리더의 능력이 더해지면 말씀이 순원의 마음 문을 열고 들어가요.',
     challenge:'치어리더처럼 달려 보세요. 이번 텀에는 가르치기 전에 순원에게 먼저 칭찬과 격려 한마디를 건네 보세요.'}
};
const ORDER = ['C','R','H','N'];

const QS = [
  {q:'순원이 “요즘 신앙생활이 무기력해요”라고 말한다면?', o:{
    C:'매일 큐티 5분처럼 작은 목표를 함께 정해 본다',
    R:'왜 그런지 천천히 이야기를 들어 준다',
    H:'“그래도 여기까지 온 게 대단해요!” 하고 힘을 준다',
    N:'지금 상황에 맞는 말씀 한 구절을 나눈다'}},
  {q:'순모임을 준비할 때 내가 가장 신경 쓰는 것은?', o:{
    C:'이번 모임으로 순원들이 무엇을 결단할지',
    R:'순원 한 명 한 명이 편하게 말할 시간이 충분한지',
    H:'모임 분위기가 밝고 즐거운지',
    N:'본문을 정확히 이해하고 핵심을 정리했는지'}},
  {q:'한 순원이 3주째 순모임에 나오지 않는다면?', o:{
    C:'다음 모임 날짜를 콕 집어 함께 오자고 제안한다',
    R:'부담 없이 따로 만나 밥 먹자고 연락한다',
    H:'“보고 싶어요!” 응원 메시지를 보낸다',
    N:'기도하며 말씀 한 구절과 함께 안부를 전한다'}},
  {q:'나눔 시간에 아무도 말을 하지 않는다면?', o:{
    C:'질문을 더 구체적으로 바꿔 한 사람씩 묻는다',
    R:'침묵을 기다려 주고 내 이야기를 먼저 꺼낸다',
    H:'가벼운 질문이나 농담으로 분위기를 푼다',
    N:'본문의 핵심으로 돌아가 다시 질문을 던진다'}},
  {q:'순모임이 끝나고 순원들에게 듣고 싶은 말은?', o:{
    C:'“순장님 덕분에 도전하게 됐어요”',
    R:'“순장님이랑 이야기하면 편해요”',
    H:'“순장님 만나면 힘이 나요”',
    N:'“순장님 말씀 듣고 정리가 됐어요”'}},
  {q:'순원이 진로 문제로 깊이 고민하고 있다면?', o:{

let i = 0, answers = [], orders = [];
const $ = id => document.getElementById(id);

function shuffle(a){ a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]];} return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }

function start(){
  i = 0; answers = new Array(QS.length).fill(null);
  orders = QS.map(()=>shuffle(ORDER));
  render(); show('quiz');
}

function render(){
  const q = QS[i];
  $('qnum').textContent = 'Q' + (i+1);
  $('qtext').textContent = q.q;
  $('count').textContent = (i+1) + '/' + QS.length;
  $('prog').style.width = (i/QS.length*100) + '%';
  $('back').style.visibility = i>0 ? 'visible' : 'hidden';
  const box = $('opts'); box.innerHTML = '';
  orders[i].forEach(t=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answers[i]===t ? ' picked' : '');
    b.textContent = q.o[t];
    b.onclick = ()=>pick(t, b);
    box.appendChild(b);
  });
}

let busy = false;
function pick(t, el){
  if(busy) return; busy = true;
  answers[i] = t;
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));
  el.classList.add('picked');
  setTimeout(()=>{
    busy = false;
    if(i < QS.length-1){ i++; render(); } else { result(); }
  }, 220);
}


function clientId(){
  try{
    let id = localStorage.getItem('pacer_id');
    if(!id){ id = Date.now().toString(36) + Math.random().toString(36).slice(2,10); localStorage.setItem('pacer_id', id); }
    return id;
  }catch(e){ return 'anon-' + Math.random().toString(36).slice(2,10); }
}
function sendResult(type, scores){
  const api = window.PACER_API;
  if(!api) return;
  try{
    fetch(api, {method:'POST', mode:'no-cors', body: JSON.stringify({type:type, scores:scores, id:clientId()})}).catch(()=>{});
  }catch(e){}
}

function result(){
  const s = {C:0,R:0,H:0,N:0};
  answers.forEach(a=>{ if(a) s[a]++; });
  const ranked = ORDER.slice().sort((a,b)=>s[b]-s[a] || ORDER.indexOf(a)-ORDER.indexOf(b));
  const top = ranked[0];
  const ties = ranked.filter(t=>s[t]===s[top]);
  const low = ranked[ranked.length-1];
  const T = TYPES[top];
  sendResult(top, s);

  $('timg').src = 'img/' + top + '-v2.jpg';
  $('timg').alt = T.name + ' 순장 캐릭터 카드';
  $('rTag').textContent = ties.length>1
    ? T.name + '과 ' + ties.slice(1).map(t=>TYPES[t].name).join(', ') + ' 성향이 비슷하게 나타났어요. ' + T.name + ' 설명을 먼저 보여 드려요.'
    : T.name + ' · ' + T.tag;
  $('rStrength').textContent = T.strength;
  $('rCaution').textContent = T.caution;

  const box = $('rScores'); box.innerHTML = '';
  ranked.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'srow' + (s[t]===s[top] ? ' top' : '');
    row.innerHTML = '<span>'+TYPES[t].name+'</span><div class="track"><div class="fill" style="width:0"></div></div><span class="n">'+s[t]+'점</span>';
    box.appendChild(row);
    requestAnimationFrame(()=>{ row.querySelector('.fill').style.width = (s[t]/QS.length*100)+'%'; });
  });
  $('prog').style.width = '100%';
  show('result');
}
